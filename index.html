<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <div id="game-container"></div>
    <div id="results"></div>

    <script>
        // Define variables
        const resultsDiv = document.getElementById("results"); // Add this line

        function getComputerChoice() {
            const randomNum = Math.floor(Math.random() * 3);
            if (randomNum === 0) {
                return "Rock";
            } else if (randomNum === 1) {
                return "Paper";
            } else {
                return "Scissors";
            }
        }

        let humanScore = 0;
        let computerScore = 0;

        
        function playRound(playerSelection) {
            // const human = getHumanChoice();
            const computer = getComputerChoice();
            let resultMessage; // Line to add: Declare resultMessage variable


            if (playerSelection === computer) {
        resultMessage = `It's a tie! You both chose ${playerSelection}.`; // Set resultMessage
    } else if (
        (playerSelection === "Rock" && computer === "Scissors") ||
        (playerSelection === "Scissors" && computer === "Paper") ||
        (playerSelection === "Paper" && computer === "Rock")
    ) {
        resultMessage = `You win! ${playerSelection} beats ${computer}.`; // Set resultMessage
        humanScore++;
    } else {
        resultMessage = `Computer wins! ${computer} beats ${playerSelection}.`; // Set resultMessage
        computerScore++;
    }

            resultsDiv.innerHTML = `
    <p>${resultMessage}</p>
    <p>Player Score: ${humanScore} | Computer Score: ${computerScore}</p>
`;


            if (humanScore === 5 || computerScore === 5) {
                const winner = humanScore === 5 ? "You" : "Computer";
                resultsDiv.innerHTML += `<p><strong>${winner} won the game!</strong></p>`;
                
                humanScore = 0;
                computerScore = 0;
            }


        }

        const gameContainer = document.getElementById("game-container"); // Reference the existing div

        const rockButton = document.createElement("button");
        const paperButton = document.createElement("button");
        const scissorsButton = document.createElement("button");

        rockButton.textContent = "Rock";
        paperButton.textContent = "Paper";
        scissorsButton.textContent = "Scissors";

        rockButton.addEventListener("click", () => playRound("Rock"));
        paperButton.addEventListener("click", () => playRound("Paper"));
        scissorsButton.addEventListener("click", () => playRound("Scissors"));

        gameContainer.appendChild(rockButton);
        gameContainer.appendChild(paperButton);
        gameContainer.appendChild(scissorsButton);

        </script>
    
</body>
</html>
